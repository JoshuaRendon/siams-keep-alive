name: Mantener SIAMS disponible

on:
  schedule:
    # Cuatro comprobaciones diarias, separadas por seis horas.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar SIAMS
        shell: bash
        run: |
          status_code="$(curl --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 120 --silent --show-error --output /dev/null --write-out '%{http_code}' --max-redirs 0 'https://siams-unal.streamlit.app/')"
          echo "Respuesta HTTP: $status_code"
          if [[ "$status_code" =~ ^[23][0-9][0-9]$ ]]; then
            echo "SIAMS respondió correctamente."
          else
            echo "SIAMS respondió con un código inesperado: $status_code"
            exit 1
          fi
