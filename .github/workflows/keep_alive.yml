name: Mantener SIAMS disponible

on:
  schedule:
    # Cuatro comprobaciones diarias, separadas por seis horas.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright y Chromium
        shell: bash
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Abrir SIAMS en un navegador real
        shell: bash
        run: node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const url = 'https://siams-unal.streamlit.app/';
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1365, height: 900 }
            });

            try {
              console.log('Abriendo SIAMS...');
              await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });

              console.log('URL cargada:', page.url());

              try {
                await page.waitForLoadState('networkidle', { timeout: 120000 });
                console.log('La página terminó de cargar.');
              } catch {
                console.log('La página mantiene conexiones activas; se continuará con la sesión abierta.');
              }

              console.log('Manteniendo el navegador abierto durante 3 minutos...');
              await page.waitForTimeout(180000);
              console.log('Sesión completada correctamente.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
