name: Mantener SIAMS disponible

on:
  schedule:
    # Cuatro comprobaciones diarias, separadas por seis horas.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar SIAMS
        shell: bash
        run: |
          curl --location             --retry 3             --retry-delay 5             --connect-timeout 20             --max-time 120             --fail             --silent             --show-error             --output /dev/null             "https://siams-unal.streamlit.app/"
